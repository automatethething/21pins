# Proposed only: append at EOF of the reviewed sshd_config, not an early Include.
# Uninstalled revised command gate: separately review actual public CA and root-owned artifacts.
# Old VM preflight did not validate this new gate/AcceptEnv/force-command policy.
Match User pins-agent
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    AuthorizedKeysFile none
    AuthorizedKeysCommand none
    AuthorizedPrincipalsCommand none
    TrustedUserCAKeys /etc/ssh/21pins/ca.pub
    AuthorizedPrincipalsFile /etc/ssh/21pins/principals/%u
    ForceCommand /usr/local/bin/21pins ssh gate --policy /etc/ssh/21pins/commands.json --workspace local --host finland-staging-221 --role observe --user pins-agent --rules-digest 96f8d2393770858bd63bee4598042401bcf4c0aca3c609d63f836253619cd208
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    AcceptEnv 21PINS_UNUSED
