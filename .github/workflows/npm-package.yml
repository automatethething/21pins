name: npm-package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
        working-directory: npm
      - run: npm run check:platforms
        working-directory: npm
      - run: npm pack --dry-run
        working-directory: npm
