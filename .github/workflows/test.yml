name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          check-latest: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/sshaccess ./internal/sshcommand ./internal/gateway
      - name: SSH production guard tests
        run: go test ./internal/sshaccess -run 'Test.*Production|Test.*Command|Test.*Certificate|Test.*Serial'
